name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: malia-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: malia-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            asset_name: malia-linux-x64-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            asset_name: malia-linux-x64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            asset_name: malia-linux-arm64-gnu
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_name: malia-win32-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl tools (if needed)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bins
          else
            cargo build --release --target ${{ matrix.target }} --bins
          fi

      - name: Package artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          strip "$BIN_DIR/malia" "$BIN_DIR/jse" 2>/dev/null || true
          mkdir -p "dist"
          tar -czf "dist/${{ matrix.asset_name }}.tar.gz" -C "$BIN_DIR" malia jse

      - name: Package artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $BinDir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "$BinDir\malia.exe", "$BinDir\jse.exe" -DestinationPath "dist\${{ matrix.asset_name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
