name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: malia-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: malia-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            asset_name: malia-linux-x64-gnu
            build_packages: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            asset_name: malia-linux-x64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            asset_name: malia-linux-arm64-gnu
            use_cross: true
            build_packages: true
            pkg_arch: arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_name: malia-win32-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl tools (if needed)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bins
          else
            cargo build --release --target ${{ matrix.target }} --bins
          fi

      - name: Package tarball (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          strip "$BIN_DIR/malia" "$BIN_DIR/jse" 2>/dev/null || true
          mkdir -p "dist"
          tar -czf "dist/${{ matrix.asset_name }}.tar.gz" -C "$BIN_DIR" malia jse

      - name: Build .deb and .rpm packages
        if: matrix.build_packages
        shell: bash
        run: |
          # Install nfpm
          curl -sfL https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_linux_amd64.tar.gz | tar xz -C /tmp nfpm
          chmod +x /tmp/nfpm

          BIN_DIR="target/${{ matrix.target }}/release"
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.pkg_arch || 'amd64' }}"

          # Copy binaries to working dir for nfpm
          cp "$BIN_DIR/malia" ./malia
          cp "$BIN_DIR/jse" ./jse 2>/dev/null || ln -sf malia jse

          # Build .deb
          ARCH="$ARCH" VERSION="$VERSION" /tmp/nfpm package \
            --config nfpm.yaml \
            --packager deb \
            --target "dist/malia_${VERSION}_${ARCH}.deb"

          # Build .rpm
          RPM_ARCH="$ARCH"
          if [ "$RPM_ARCH" = "amd64" ]; then RPM_ARCH="x86_64"; fi
          if [ "$RPM_ARCH" = "arm64" ]; then RPM_ARCH="aarch64"; fi
          ARCH="$RPM_ARCH" VERSION="$VERSION" /tmp/nfpm package \
            --config nfpm.yaml \
            --packager rpm \
            --target "dist/malia-${VERSION}-1.${RPM_ARCH}.rpm"

          rm -f ./malia ./jse
          ls -la dist/

      - name: Package zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $BinDir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "$BinDir\malia.exe", "$BinDir\jse.exe" -DestinationPath "dist\${{ matrix.asset_name }}.zip" -Force

      - name: Build Windows installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $BinDir = "target/${{ matrix.target }}/release"
          $Version = "${{ github.ref_name }}".TrimStart("v")

          # Download Inno Setup
          $InnoUrl = "https://jrsoftware.org/download.php/is.exe"
          Invoke-WebRequest -Uri $InnoUrl -OutFile "$env:TEMP\innosetup.exe" -UseBasicParsing
          Start-Process -FilePath "$env:TEMP\innosetup.exe" -Args "/VERYSILENT /SUPPRESSMSGBOXES /DIR=`"$env:TEMP\inno`"" -Wait

          # Copy binaries next to the .iss script
          Copy-Item "$BinDir\malia.exe" -Destination "scripts\malia.exe"
          Copy-Item "$BinDir\jse.exe" -Destination "scripts\jse.exe"

          # Compile installer
          & "$env:TEMP\inno\ISCC.exe" "/DAppVersion=$Version" "scripts\installer.iss"
          Move-Item "scripts\malia-win32-x64-setup.exe" -Destination "dist\malia-win32-x64-setup.exe"

          # Clean up
          Remove-Item "scripts\malia.exe", "scripts\jse.exe" -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
