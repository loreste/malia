name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and release (vMAJOR.MINOR.PATCH)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: malia-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: malia-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            asset_name: malia-linux-x64-gnu
            build_packages: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            asset_name: malia-linux-x64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            asset_name: malia-linux-arm64-gnu
            use_cross: true
            build_packages: true
            pkg_arch: arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_name: malia-win32-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an existing vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl tools (if needed)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }} --bins
          else
            cargo build --locked --release --target ${{ matrix.target }} --bins
          fi

      - name: Package tarball (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          strip "$BIN_DIR/malia" "$BIN_DIR/jse" 2>/dev/null || true
          mkdir -p "dist"
          tar -czf "dist/${{ matrix.asset_name }}.tar.gz" -C "$BIN_DIR" malia jse

      - name: Build .deb and .rpm packages
        if: matrix.build_packages
        shell: bash
        run: |
          # Install nfpm
          NFPM_VERSION=2.47.0
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar xz -C /tmp nfpm
          /tmp/nfpm --version

          BIN_DIR="target/${{ matrix.target }}/release"
          VERSION="${RELEASE_TAG#v}"
          ARCH="${{ matrix.pkg_arch || 'amd64' }}"

          # Copy binaries to working dir for nfpm
          cp "$BIN_DIR/malia" ./malia
          cp "$BIN_DIR/jse" ./jse 2>/dev/null || cp ./malia ./jse

          # Build .deb
          ARCH="$ARCH" VERSION="$VERSION" /tmp/nfpm package \
            --config nfpm.yaml \
            --packager deb \
            --target "dist/malia_${VERSION}_${ARCH}.deb"

          # Build .rpm
          RPM_ARCH="$ARCH"
          if [ "$RPM_ARCH" = "amd64" ]; then RPM_ARCH="x86_64"; fi
          if [ "$RPM_ARCH" = "arm64" ]; then RPM_ARCH="aarch64"; fi
          ARCH="$RPM_ARCH" VERSION="$VERSION" /tmp/nfpm package \
            --config nfpm.yaml \
            --packager rpm \
            --target "dist/malia-${VERSION}-1.${RPM_ARCH}.rpm"

          rm -f ./malia ./jse
          ls -la dist/

      - name: Package zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $BinDir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "$BinDir\malia.exe", "$BinDir\jse.exe" -DestinationPath "dist\${{ matrix.asset_name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an existing vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG"

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
